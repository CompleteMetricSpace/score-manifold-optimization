[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "score-manifold-optimization"
version = "0.1.0"
description = "Paper-focused diffusion training and DRGD optimization/control"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch",
  "numpy",
  "scipy",
  "pyyaml",
  "matplotlib",
  "einops",
]

[project.urls]
Homepage = "https://github.com/CompleteMetricSpace/score-manifold-optimization"
Repository = "https://github.com/CompleteMetricSpace/score-manifold-optimization"
Issues = "https://github.com/CompleteMetricSpace/score-manifold-optimization/issues"

[project.optional-dependencies]
dev = [
  "pytest",
]
mujoco = [
  "mujoco>=3.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
